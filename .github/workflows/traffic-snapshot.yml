name: Traffic Snapshot

# For: awslabs/rds-support-tools
# Tracks repo-wide clones/views AND per-file page views (popular/paths),
# since this repo hosts many independent tools.
# GitHub's traffic API only retains 14 days; this appends to metrics/*.jsonl
# and regenerates metrics/SUMMARY.md. Runs on GitHub-hosted runners.
#
# Setup: add a repo secret TRAFFIC_TOKEN — a PAT with Administration:Read +
# Contents:Read/Write (or a classic token with `repo` scope).
#
# LIMITATION: popular/paths returns only the TOP 10 paths per 14-day window,
# so cold tools may never appear. No true per-file download count exists for
# files served from the repo tree (only Release assets have that).

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Capture traffic metrics
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p metrics
          DATE=$(date -u +%Y-%m-%d)

          CLONES=$(gh api "repos/$REPO/traffic/clones") || { echo "ERROR: clones fetch failed — check TRAFFIC_TOKEN" >&2; exit 1; }
          VIEWS=$(gh api "repos/$REPO/traffic/views")   || { echo "ERROR: views fetch failed — check TRAFFIC_TOKEN"  >&2; exit 1; }
          PATHS=$(gh api "repos/$REPO/traffic/popular/paths") || { echo "ERROR: paths fetch failed — check TRAFFIC_TOKEN" >&2; exit 1; }

          jq -c -n \
            --arg date "$DATE" \
            --argjson clones_raw "$CLONES" \
            --argjson views_raw "$VIEWS" \
            '{date: $date, clones_daily: ($clones_raw.clones // []), views_daily: ($views_raw.views // [])}' \
            >> metrics/traffic_history.jsonl

          jq -c -n \
            --arg date "$DATE" \
            --argjson paths_raw "$PATHS" \
            '{date: $date, paths: ($paths_raw | map({path: .path, title: .title, views: .count, uniques: .uniques}))}' \
            >> metrics/paths_history.jsonl

          jq -s '
            ([.[].clones_daily[]] | map({(.timestamp[0:10]): {c: .count, cu: .uniques}}) | add // {}) as $cmap
            | ([.[].views_daily[]] | map({(.timestamp[0:10]): {v: .count, vu: .uniques}}) | add // {}) as $vmap
            | (($cmap | keys) + ($vmap | keys) | unique | sort)
            | map({date: ., clones: ($cmap[.].c // 0), clones_unique: ($cmap[.].cu // 0), views: ($vmap[.].v // 0), views_unique: ($vmap[.].vu // 0)})
          ' metrics/traffic_history.jsonl > metrics/daily_merged.json

          CUTOFF=$(date -u -d '90 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-90d +%Y-%m-%d)

          TOTALS=$(jq --arg cutoff "$CUTOFF" '
            map(select(.date >= $cutoff))
            | {clones: (map(.clones)|add//0), clones_unique: (map(.clones_unique)|add//0),
               views: (map(.views)|add//0), views_unique: (map(.views_unique)|add//0), days: length}
          ' metrics/daily_merged.json)

          C=$(echo "$TOTALS" | jq '.clones');        CU=$(echo "$TOTALS" | jq '.clones_unique')
          V=$(echo "$TOTALS" | jq '.views');         VU=$(echo "$TOTALS" | jq '.views_unique')
          DAYS=$(echo "$TOTALS" | jq '.days')

          PATH_TABLE=$(jq -s --arg cutoff "$CUTOFF" '
            map(select(.date >= $cutoff))
            | [.[] | .date as $d | .paths[] | {path, title, views, uniques, date: $d}]
            | group_by(.path)
            | map({
                path: .[0].path,
                title: (.[0].title // .[0].path),
                peak_views_14d: (map(.views) | max),
                peak_uniques_14d: (map(.uniques) | max),
                days_in_top10: length
              })
            | sort_by(.peak_views_14d) | reverse
          ' metrics/paths_history.jsonl)

          {
            echo "# Traffic Summary — Last 90 Days"
            echo ""
            echo "> Auto-generated by \`.github/workflows/traffic-snapshot.yml\`. Last updated: $DATE (UTC)"
            echo ""
            echo "## Repo-Wide Totals"
            echo ""
            echo "| Metric | 90-Day Total |"
            echo "|--------|-------------:|"
            echo "| Git clones | $C |"
            echo "| Unique cloners | $CU |"
            echo "| Page views | $V |"
            echo "| Unique visitors | $VU |"
            echo ""
            echo "_Based on $DAYS days of captured data. History begins when this workflow was first enabled._"
            echo ""
            echo "## Per-Tool Popularity (by file path)"
            echo ""
            echo "> \`peak_views_14d\` = highest 14-day view count observed for that file."
            echo "> \`days_in_top10\` = how many daily snapshots ranked this file in the top 10."
            echo "> Only the top 10 paths per day are available from GitHub, so cold tools may not appear."
            echo ""
            echo "| File Path | Peak Views (14d) | Peak Uniques (14d) | Days in Top 10 |"
            echo "|-----------|----------------:|-------------------:|---------------:|"
            echo "$PATH_TABLE" | jq -r '.[] | "| `\(.path)` | \(.peak_views_14d) | \(.peak_uniques_14d) | \(.days_in_top10) |"'
            echo ""
            echo "## Recent Daily Activity (last 30 days)"
            echo ""
            echo "| Date | Clones | Unique | Views | Unique |"
            echo "|------|-------:|-------:|------:|-------:|"
            jq -r 'sort_by(.date) | reverse | .[0:30] | .[] | "| \(.date) | \(.clones) | \(.clones_unique) | \(.views) | \(.views_unique) |"' metrics/daily_merged.json
          } > metrics/SUMMARY.md

          rm -f metrics/daily_merged.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/traffic_history.jsonl metrics/paths_history.jsonl metrics/SUMMARY.md
          if git diff --cached --quiet; then
            echo "No metric changes to commit."
            exit 0
          fi
          git commit -m "chore: daily traffic snapshot $(date -u +%Y-%m-%d)"
          git push
